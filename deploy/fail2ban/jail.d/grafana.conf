# fail2ban jail for Grafana. Ban an IP after 10 failed login attempts
# within a 10-minute window, for 1 hour. Adjust bantime/findtime to taste.
#
# Install: copy this file to /etc/fail2ban/jail.d/grafana.conf and
# deploy/fail2ban/filter.d/grafana.conf to /etc/fail2ban/filter.d/grafana.conf,
# then `systemctl restart fail2ban`.

[grafana]
enabled  = true
filter   = grafana
# Absolute path on the VPS to this repo's deploy/grafana/logs/grafana.log
# (adjust APP_DIR to wherever the repo actually lives, e.g. /root/league-2).
logpath  = /root/league-2/deploy/grafana/logs/grafana.log
maxretry = 10
findtime = 600
bantime  = 3600
