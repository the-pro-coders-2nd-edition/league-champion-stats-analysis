# fail2ban jail for Grafana. Ban an IP PERMANENTLY after 10 failed login
# attempts within a 10-minute window (bantime = -1 means "forever" in
# fail2ban). To lift a permanent ban manually later:
#   fail2ban-client set grafana unbanip <ip>
#
# Install: copy this file to /etc/fail2ban/jail.d/grafana.conf and
# deploy/fail2ban/filter.d/grafana.conf to /etc/fail2ban/filter.d/grafana.conf,
# then `systemctl restart fail2ban`.

[grafana]
enabled  = true
filter   = grafana
# Absolute path on the VPS to this repo's deploy/grafana/logs/grafana.log
# (adjust if the repo lives somewhere other than /root/league-champion-stats-analysis).
logpath  = /root/league-champion-stats-analysis/deploy/grafana/logs/grafana.log
maxretry = 10
findtime = 600
bantime  = -1
