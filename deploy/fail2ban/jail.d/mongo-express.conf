# fail2ban jail for mongo-express. Ban an IP PERMANENTLY after 10 failed
# Basic Auth logins within a 10-minute window (bantime = -1 means "forever"
# in fail2ban) -- same thresholds as the Grafana jail, since Brice chose
# permanent bans there and there's no reason mongo-express (also giving an
# attacker a MongoDB admin UI on success) should be less strict. To lift a
# permanent ban manually later:
#   fail2ban-client set mongo-express unbanip <ip>
#
# Install: copy this file to /etc/fail2ban/jail.d/mongo-express.conf and
# deploy/fail2ban/filter.d/mongo-express.conf to
# /etc/fail2ban/filter.d/mongo-express.conf, then `systemctl restart fail2ban`.

[mongo-express]
enabled  = true
filter   = mongo-express
# Absolute path on the VPS to the Caddy access log for the mongo-express
# site (deploy/run.sh's `mongo.${DOMAIN}` block, `log { output file ... }`).
# Owned by Caddy (root), not by this repo -- unlike Grafana's logpath above,
# this is not a path under the repo checkout.
logpath  = /var/log/caddy/mongo-express-access.log
maxretry = 10
findtime = 600
bantime  = -1
