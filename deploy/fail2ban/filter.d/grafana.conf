# fail2ban filter for Grafana failed logins.
#
# Grafana logs a failed login attempt (both the older key=value "lvl=eror
# msg=..." format and the "Request Completed ... status=401 path=/login"
# access-log format some versions/configs emit instead) with the client's
# address in a `remote_addr=<ip>` field. Both patterns are matched below
# since the exact wording has shifted across Grafana versions.
#
# Verify against the real log before trusting this in production:
#   fail2ban-regex /path/to/deploy/grafana/logs/grafana.log /etc/fail2ban/filter.d/grafana.conf
# If it reports 0 matches after a real failed login, tail the log file,
# paste a sample failed-login line, and adjust failregex to match it.

[Definition]
failregex = ^.*lvl=eror msg="Invalid username or password".*remote_addr=<HOST>.*$
            ^.*msg="Invalid username or password".*remote_addr=<HOST>.*$
            ^.*msg="Request Completed".*method=POST path=/login(/.*)? status=401.*remote_addr=<HOST>.*$

ignoreregex =
