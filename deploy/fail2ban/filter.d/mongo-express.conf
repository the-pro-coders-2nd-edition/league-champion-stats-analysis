# fail2ban filter for mongo-express failed Basic Auth logins.
#
# mongo-express has no failed-login log of its own -- it just returns a
# plain HTTP 401 via its Basic Auth middleware, with nothing to tail -- so
# this filter operates on CADDY's access log for the mongo-express site
# (deploy/run.sh's `${DOMAIN}:8081` block, `log { output file
# /var/log/caddy/mongo-express-access.log }`), not on any mongo-express
# output. Caddy's default access log format is one JSON object per line,
# e.g.:
#   {"level":"info","ts":...,"logger":"http.log.access.log0","msg":"handled
#   request","request":{"remote_ip":"1.2.3.4","remote_port":"...",
#   "client_ip":"1.2.3.4","proto":"HTTP/1.1","method":"GET","host":
#   "mongo.example.com","uri":"/","headers":{...}},"bytes_read":0,
#   "duration":...,"size":...,"status":401,"resp_headers":{...}}
#
# `status` is a top-level field and `remote_ip` is nested under `request`,
# so rather than trying to fully parse the JSON structure (fiddly, and
# order-of-keys is not guaranteed to be stable across Caddy versions), this
# matches on raw substrings: a `"status":401` anywhere on the line plus a
# `"remote_ip":"<HOST>"` anywhere on the same line. This is robust to key
# reordering but WILL also match a 401 on a completely unrelated request to
# the same site from the same IP within the same log line -- acceptable
# here since every request to ${DOMAIN}:8081 is either the mongo-express
# UI itself or its Basic Auth challenge, so a 401 on this site is already a
# meaningful signal.
#
# Verify against the real log before trusting this in production:
#   fail2ban-regex /var/log/caddy/mongo-express-access.log /etc/fail2ban/filter.d/mongo-express.conf
# If it reports 0 matches after a real failed login, tail the log file,
# paste a sample 401 line, and confirm the exact field names/ordering match
# what's assumed above (Caddy's JSON access log schema has been stable
# across recent versions but this has not been verified live against this
# specific deployment).

[Definition]
failregex = ^.*"status":\s*401.*"remote_ip":\s*"<HOST>".*$
            ^.*"remote_ip":\s*"<HOST>".*"status":\s*401.*$

ignoreregex =
