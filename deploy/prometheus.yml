global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api-ui
    static_configs:
      - targets: ["api-ui:8000"]

  - job_name: runner
    static_configs:
      - targets: ["runner:9100"]

  - job_name: cron-watch
    static_configs:
      - targets: ["cron-watch:9101"]

  - job_name: peers
    static_configs:
      - targets: ["peers:9102"]
