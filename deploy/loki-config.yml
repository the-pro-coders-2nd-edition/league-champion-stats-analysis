auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # trace_id/version are ingested as structured metadata (see
  # deploy/alloy-config.alloy), not labels -- avoids blowing up Loki's
  # label index with a unique value per request/deploy, per Loki's own
  # guidance for exactly this use case.
  allow_structured_metadata: true
  retention_period: 744h # 31 days
