services:
  api-ui:
    build:
      context: .
      args:
        # Passed through from the host's GIT_COMMIT env var (set by CI to
        # `$(git rev-parse HEAD)` at build time; defaults to "dev" for a
        # local/unset build -- see .env.example) -- Finding 2 of the Phase 6
        # final whole-branch review: without this, GIT_COMMIT is read
        # everywhere (`os.environ.get("GIT_COMMIT", "dev")`) but never
        # actually set, so every real deployment's `version` tag silently
        # stays "dev".
        GIT_COMMIT: ${GIT_COMMIT:-dev}
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongo:27017/league_stats
      - RUNNER_GRPC_TARGET=runner:50051
      - ANALYZER_WATCH_MODE=grpc
      # Phase 8, Task 1 fix (was `in_process` until then): `RawMatchStore`
      # (the only `_build_job_services` backing store since Task 1 deleted
      # `MatchStore`) does not implement any of the peer-game methods the
      # in-process peer path (`build_peer_for_pool`) calls directly on
      # `services.store` -- `api-ui` runs `execute_job` itself whenever
      # `runner_mode` is `in_process` (its own default), so this was a real
      # `AttributeError` crash on the first ranked build needing a peer
      # baseline, not a hypothetical. `peers_mode=grpc` routes stage B's peer
      # comparison through `_build_peer_for_pool_via_grpc` instead (PEERS'
      # `RequestBaseline` RPC), which never touches `services.store`'s
      # peer-game surface -- `finish_peer_comparison`'s own store use
      # (`collect_user_history_peers`) only calls `iter_match_ids`/
      # `load_match`, which `RawMatchStore` does implement.
      #
      # This does NOT contradict the comment this replaced: `api-ui` still
      # never hosts a `RunnerServiceServicer`, so PEERS' async
      # `NotifyPeerBaselineReady` callback still can never reach it -- see
      # `_warn_on_peers_grpc_topology_precondition`'s own warning, which
      # fires here on purpose. The accepted tradeoff is `_run_stage_b`'s
      # documented behavior when a PEERS baseline falls to the slow path from
      # this process: `_build_peer_for_pool_via_grpc` polls
      # `_peer_baseline_waiters` for the callback that will never come, until
      # `_PEERS_BASELINE_WAIT_TIMEOUT_S` elapses, then logs and skips that
      # one build's peer comparison (soft failure -- the base report is
      # already served). Degraded-but-correct beats an `AttributeError`
      # crash on every ranked build.
      - ANALYZER_PEERS_MODE=grpc
      # PEERS_GRPC_TARGET defaults to localhost:50053 (wrong from inside this
      # container) -- must point at the compose network's `peers` host, same
      # as `runner`'s own pin below. Port matches `peers`' `PEERS_GRPC_PORT`.
      - PEERS_GRPC_TARGET=peers:50053
      # Without this, api-ui's WelcomeBackSubscriber is never constructed (it's
      # gated on this var being set -- see WebConfig.cron_watch_grpc_target), so
      # the welcome-back feature would have no live gRPC path in this
      # deployment even though cron-watch is actually running here. Port must
      # match cron-watch's CRON_WATCH_GRPC_PORT below.
      - CRON_WATCH_GRPC_TARGET=cron-watch:50052
    volumes:
      # Report artifacts (HTML/CSV/JSON) referenced by job rows, now stored in
      # Mongo (`JobStore`, Phase 8 Task 4) rather than the deleted `app-data`
      # volume. Without this, recreating this container wipes
      # `/app/output` while the DB still says jobs completed, so a "done"
      # job's report link 404s. `/app/.cache` (match/HTTP caches) is
      # deliberately left ephemeral: losing it only costs slower re-fetches on
      # next start, not a broken link, so it's not worth a volume here.
      - app-output:/app/output
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  runner:
    build:
      context: .
      args:
        # Passed through from the host's GIT_COMMIT env var (set by CI to
        # `$(git rev-parse HEAD)` at build time; defaults to "dev" for a
        # local/unset build -- see .env.example) -- Finding 2 of the Phase 6
        # final whole-branch review: without this, GIT_COMMIT is read
        # everywhere (`os.environ.get("GIT_COMMIT", "dev")`) but never
        # actually set, so every real deployment's `version` tag silently
        # stays "dev".
        GIT_COMMIT: ${GIT_COMMIT:-dev}
    command: ["uv", "run", "python", "-m", "league_stats_runner"]
    environment:
      - MONGO_URI=mongodb://mongo:27017/league_stats
      - RUNNER_GRPC_PORT=50051
      - RUNNER_METRICS_PORT=9100
      # REQUIRED, not opt-in (Phase 8, Task 1): RUNNER's `_build_job_services`
      # always constructs the Mongo-backed `RawMatchStore` (`MatchStore`, its
      # local on-disk predecessor, was deleted), which does not implement the
      # peer-game methods the in-process peer path needs -- without this pin,
      # RUNNER would crash with an `AttributeError` on the first ranked
      # build's peer comparison. Pinned here (not the shared .env, which
      # api-ui and cron-watch also read) so it doesn't also flip on those
      # services, which don't need it for their own topologies.
      # PEERS_GRPC_TARGET must point at the compose network's `peers` host,
      # since its own default (localhost:50053) is wrong here. This
      # combination is not yet fully wired/tested end-to-end in compose
      # (known follow-up): PEERS' baseline callback path
      # (NotifyPeerBaselineReady) back into RUNNER hasn't been exercised
      # against this specific topology.
      - ANALYZER_PEERS_MODE=grpc
      - PEERS_GRPC_TARGET=peers:50053
    env_file:
      - .env
    # No `ports:` here on purpose: RUNNER is only ever dialed by `api-ui` over
    # the compose network (`RUNNER_GRPC_TARGET=runner:50051` above), never
    # from outside it. Add a `ports:` mapping here if external debugging
    # access is ever needed.
    depends_on:
      - mongo

  peers:
    build:
      context: .
      args:
        # Passed through from the host's GIT_COMMIT env var (set by CI to
        # `$(git rev-parse HEAD)` at build time; defaults to "dev" for a
        # local/unset build -- see .env.example) -- Finding 2 of the Phase 6
        # final whole-branch review: without this, GIT_COMMIT is read
        # everywhere (`os.environ.get("GIT_COMMIT", "dev")`) but never
        # actually set, so every real deployment's `version` tag silently
        # stays "dev".
        GIT_COMMIT: ${GIT_COMMIT:-dev}
    command: ["uv", "run", "python", "-m", "league_stats_peers"]
    environment:
      - MONGO_URI=mongodb://mongo:27017/league_stats
      - RUNNER_GRPC_TARGET=runner:50051
      - PEERS_GRPC_PORT=50053
      - PEERS_METRICS_PORT=9102
    env_file:
      - .env
    # No `ports:` here on purpose, same reasoning as `runner`/`cron-watch`:
    # nothing outside the compose network dials PEERS directly today.
    # `api-ui` now also pins `ANALYZER_PEERS_MODE=grpc` /
    # `PEERS_GRPC_TARGET=peers:50053` (Phase 8, Task 1 fix -- see its own
    # comment: `RawMatchStore` doesn't support the in-process peer path's
    # peer-game methods), so `runner`, `peers` and `api-ui` all dial this
    # service today. `cron-watch` deliberately does not: it never calls
    # `execute_job`/`build_peer_for_pool` at all (its `CronWatchServicer`
    # only enqueues into the shared `JobStore` -- see
    # `cron_watch/service.py`'s "shared job store" design note), so it
    # has no peer-comparison code path to route through PEERS.
    depends_on:
      - mongo

  cron-watch:
    build:
      context: .
      args:
        # Passed through from the host's GIT_COMMIT env var (set by CI to
        # `$(git rev-parse HEAD)` at build time; defaults to "dev" for a
        # local/unset build -- see .env.example) -- Finding 2 of the Phase 6
        # final whole-branch review: without this, GIT_COMMIT is read
        # everywhere (`os.environ.get("GIT_COMMIT", "dev")`) but never
        # actually set, so every real deployment's `version` tag silently
        # stays "dev".
        GIT_COMMIT: ${GIT_COMMIT:-dev}
    command: ["uv", "run", "python", "-m", "league_stats_cron_watch"]
    environment:
      - MONGO_URI=mongodb://mongo:27017/league_stats
      - CRON_WATCH_GRPC_PORT=50052
      - CRON_WATCH_METRICS_PORT=9101
    env_file:
      - .env
    # No `ports:` here on purpose, same reasoning as `runner`: nothing outside
    # the compose network dials CRON-watch directly today.
    depends_on:
      - mongo

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # No `ports:` here on purpose: Prometheus is only ever queried by
    # `grafana` over the compose network -- nothing outside it needs direct
    # access. Scrape targets (api-ui/runner/cron-watch/peers) are pull-based,
    # so no `depends_on` is needed here either -- Prometheus retries scrapes
    # on its own interval regardless of which service starts first.

  grafana:
    image: grafana/grafana:11.3.1
    # GF_SECURITY_ADMIN_USER/GF_SECURITY_ADMIN_PASSWORD come from the
    # gitignored .env file below (see .env.example for placeholders) --
    # deliberately not re-listed under `environment:` here, matching how
    # every other secret (RIOT_API_KEY, etc.) in this file is only ever
    # sourced via `env_file`, never inlined.
    env_file:
      - .env
    volumes:
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    # Loopback-only publish (not `3000:3000` like api-ui's `8000:8000`):
    # `deploy/run.sh` runs Caddy directly on the VPS host (not in this
    # compose network), so it needs a host-reachable port to reverse-proxy
    # `grafana.<DOMAIN>` to -- but grafana holds admin credentials, so unlike
    # api-ui this must never be reachable from outside the host itself.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  mongo-data:
  app-output:
  grafana-data:
