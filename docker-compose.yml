services:
  api-ui:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongo:27017/league_stats
      - RUNNER_GRPC_TARGET=runner:50051
      - ANALYZER_WATCH_MODE=grpc
      # Pinned explicitly (opposite of ANALYZER_WATCH_MODE above, which is
      # pinned to grpc here) -- `api-ui` never hosts a RunnerServiceServicer,
      # so PEERS' async callback (NotifyPeerBaselineReady) could never reach
      # it if peers_mode=grpc were set here (see WebConfig's own validator/
      # warning). The natural way to enable PEERS grpc mode elsewhere is to
      # add ANALYZER_PEERS_MODE=grpc to the shared .env file below -- without
      # this explicit pin, that would silently also flip it on here, stalling
      # every slow-path pool for the full baseline-wait timeout. See the
      # `peers` service's own comment below for the topology this is meant
      # to be enabled on instead.
      - ANALYZER_PEERS_MODE=in_process
      # Pinned explicitly for the same reason as ANALYZER_PEERS_MODE above:
      # runner_storage_mode=mongo REQUIRES peers_mode=grpc (WebConfig raises
      # otherwise). Since api-ui pins peers_mode=in_process here, inheriting
      # ANALYZER_RUNNER_STORAGE_MODE=mongo from the shared .env (the natural
      # way to enable it for `runner` below) would trip that validator and
      # crash api-ui at startup the moment it built a WebConfig -- api-ui runs
      # execute_job itself whenever runner_mode is in_process (its own
      # default), so this isn't a hypothetical.
      - ANALYZER_RUNNER_STORAGE_MODE=sqlite
      # Without this, api-ui's WelcomeBackSubscriber is never constructed (it's
      # gated on this var being set -- see WebConfig.cron_watch_grpc_target), so
      # the welcome-back feature would have no live gRPC path in this
      # deployment even though cron-watch is actually running here. Port must
      # match cron-watch's CRON_WATCH_GRPC_PORT below.
      - CRON_WATCH_GRPC_TARGET=cron-watch:50052
    volumes:
      # Shared with `cron-watch`: both open their own `JobStore` connection
      # onto the same `data/app.sqlite` file (see
      # `league_stats/cron_watch/service.py`'s "shared SQLite volume" design
      # note). Without this mount each container would see its own, empty
      # `data/` directory and CRON-watch's enqueued jobs would never surface
      # through this service's job-status API.
      - app-data:/app/data
      # Report artifacts (HTML/CSV/JSON) referenced by job rows in the now-
      # persistent `app-data` volume above. Without this, recreating this
      # container wipes `/app/output` while the DB still says jobs completed,
      # so a "done" job's report link 404s. `/app/.cache` (match/HTTP caches)
      # is deliberately left ephemeral: losing it only costs slower re-fetches
      # on next start, not a broken link, so it's not worth a volume here.
      - app-output:/app/output
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  runner:
    build: .
    command: ["uv", "run", "python", "-m", "league_stats.runner"]
    environment:
      - MONGO_URI=mongodb://mongo:27017/league_stats
      - RUNNER_GRPC_PORT=50051
      - RUNNER_METRICS_PORT=9100
      # Not active by default -- example only (Phase 5 final review, Finding
      # 3). Enabling ANALYZER_RUNNER_STORAGE_MODE=mongo in the shared .env
      # alone crashes RUNNER at its own WebConfig validator, which requires
      # peers_mode=grpc whenever runner_storage_mode=mongo. Uncomment both
      # lines below on THIS service (not the shared .env, which api-ui and
      # cron-watch also read) to actually enable it -- PEERS_GRPC_TARGET
      # must point at the compose network's `peers` host, since its own
      # default (localhost:50053) is wrong here. This combination is not yet
      # fully wired/tested end-to-end in compose (known follow-up): nothing
      # here changes RUNNER's own image/dependencies, and PEERS' baseline
      # callback path (NotifyPeerBaselineReady) back into RUNNER hasn't been
      # exercised against this specific topology.
      # - ANALYZER_PEERS_MODE=grpc
      # - PEERS_GRPC_TARGET=peers:50053
    env_file:
      - .env
    # No `ports:` here on purpose: RUNNER is only ever dialed by `api-ui` over
    # the compose network (`RUNNER_GRPC_TARGET=runner:50051` above), never
    # from outside it. Add a `ports:` mapping here if external debugging
    # access is ever needed.
    depends_on:
      - mongo

  peers:
    build: .
    command: ["uv", "run", "python", "-m", "league_stats.peers"]
    environment:
      - MONGO_URI=mongodb://mongo:27017/league_stats
      - RUNNER_GRPC_TARGET=runner:50051
      - PEERS_GRPC_PORT=50053
      - PEERS_METRICS_PORT=9102
    env_file:
      - .env
    # No `ports:` here on purpose, same reasoning as `runner`/`cron-watch`:
    # nothing outside the compose network dials PEERS directly today. Note
    # `api-ui`'s `peers_mode` still defaults to `in_process` (unchanged by
    # this task) -- wiring `ANALYZER_PEERS_MODE=grpc` /
    # `PEERS_GRPC_TARGET=peers:50053` into `api-ui`/`runner` so they actually
    # dial this service remains a follow-up for the controller, not decided
    # here.
    depends_on:
      - mongo

  cron-watch:
    build: .
    command: ["uv", "run", "python", "-m", "league_stats.cron_watch"]
    environment:
      - MONGO_URI=mongodb://mongo:27017/league_stats
      - CRON_WATCH_GRPC_PORT=50052
      - CRON_WATCH_METRICS_PORT=9101
      # Same reasoning as api-ui's pin above: cron-watch's __main__ also calls
      # load_web_config() (to build the WebConfig its own JobStore/enqueue
      # path needs), and its peers_mode is never pinned to grpc here, so
      # inheriting ANALYZER_RUNNER_STORAGE_MODE=mongo from the shared .env
      # would trip WebConfig's runner_storage_mode validator and crash it too.
      - ANALYZER_RUNNER_STORAGE_MODE=sqlite
    env_file:
      - .env
    volumes:
      # Shared with `api-ui` -- see the comment on `api-ui`'s volume above.
      # This is the whole mechanism Task 4's "option (b)" design depends on:
      # CRON-watch enqueues jobs by writing directly into this file, not by
      # calling RUNNER.
      - app-data:/app/data
    # No `ports:` here on purpose, same reasoning as `runner`: nothing outside
    # the compose network dials CRON-watch directly today.
    depends_on:
      - mongo

volumes:
  mongo-data:
  app-data:
  app-output:
