services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongo:27017/league_stats
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  runner:
    build: .
    command: ["uv", "run", "python", "-m", "league_stats.runner"]
    environment:
      - MONGO_URI=mongodb://mongo:27017/league_stats
      - RUNNER_GRPC_PORT=50051
    env_file:
      - .env
    depends_on:
      - mongo

volumes:
  mongo-data:
