<div class="score-set-item" title="{{ comp.hint }}"><div class="score-set-item-head"><span class="score-set-item-name">{{ comp.name }}</span> <span class="score-set-item-score" style="color: {{ 'var(--color-text)' if (comp.tone or 'flat') == 'flat' else 'var(--tone-' + (comp.tone or 'flat') + '-fg)' }}">{{ '%.0f' % comp.score }}</span></div> <div class="score-set-item-bar"><i class="score-set-item-fill" style="width: {{ comp.score }}%; background: var(--tone-{{ comp.tone or 'flat' }}-line)"></i> <i class="score-set-item-tick"></i></div> <div class="score-set-item-foot"><span class="score-set-item-verdict" style="color: {{ 'var(--color-text)' if (comp.tone or 'flat') == 'flat' else 'var(--tone-' + (comp.tone or 'flat') + '-fg)' }}">{{ comp.verdict or 'Solid' }}</span> <span class="score-set-item-sub">{{ comp.value }}</span></div> </div>
