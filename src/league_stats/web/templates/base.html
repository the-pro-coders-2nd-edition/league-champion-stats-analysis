<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ app_title }}{% endblock %}</title>
{% if favicon_href %}
<link rel="icon" type="image/png" href="{{ favicon_href }}">
<link rel="apple-touch-icon" href="{{ favicon_href }}">
{% endif %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1118; --panel: #171a24; --panel-2: #1e2230; --border: #2a2f40;
  --text: #e8eaf2; --muted: #9aa0b5; --accent: #7c6cf0; --win: #3fb68b; --loss: #e05563;
  --font: "Manrope", -apple-system, "Segoe UI", sans-serif;
  --radius: 10px;
  --radius-lg: 14px;
  --shadow-soft: 0 8px 28px rgba(0, 0, 0, .28);
  --focus-ring: 0 0 0 3px rgba(124, 108, 240, .35);
  --scrollbar-track: var(--bg);
  --scrollbar-thumb: #353b50;
  --scrollbar-thumb-hover: var(--accent);
}
html {
  scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
  scrollbar-width: thin;
}
* { box-sizing: border-box; margin: 0; padding: 0; scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track); scrollbar-width: thin; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--scrollbar-track); }
::-webkit-scrollbar-thumb {
  background: var(--scrollbar-thumb);
  border-radius: 999px;
  border: 3px solid var(--scrollbar-track);
  min-height: 40px;
}
::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }
::-webkit-scrollbar-corner { background: var(--scrollbar-track); }
body {
  background-color: var(--bg);
  background-image:
    radial-gradient(ellipse 90% 55% at 12% -8%, rgba(124, 108, 240, .2), transparent 55%),
    radial-gradient(ellipse 70% 45% at 92% 0%, rgba(77, 184, 196, .08), transparent 50%),
    radial-gradient(ellipse 50% 35% at 50% 100%, rgba(124, 108, 240, .06), transparent 60%);
  background-attachment: fixed;
  color: var(--text);
  font: 15px/1.55 var(--font);
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; font-weight: 600; }
a:hover { text-decoration: underline; }

.shell { max-width: 1100px; margin: 0 auto; padding: 56px 24px 72px; }

.app-brand {
  display: flex; align-items: center; gap: 14px; margin-bottom: 12px;
  color: inherit; text-decoration: none; font-weight: inherit;
}
.app-brand:hover { text-decoration: none; }
.app-brand-title {
  font-size: clamp(26px, 4vw, 34px); font-weight: 800; color: var(--accent);
  line-height: 1.15; letter-spacing: -.02em;
}
.app-logo {
  width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0;
  object-fit: cover; box-shadow: 0 2px 12px rgba(0, 0, 0, .35);
}

.home-lead {
  color: var(--muted); font-size: 16px; line-height: 1.5; max-width: 42ch;
  margin: 0 0 28px;
}

.page-nav { margin: 0 0 24px; font-size: 14px; }
.page-nav a { color: var(--muted); font-weight: 600; }
.page-nav a:hover { color: var(--accent); text-decoration: none; }
.breadcrumb {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  margin: 0 0 24px; font-size: 14px; color: var(--muted);
}
.breadcrumb a { color: var(--muted); font-weight: 600; }
.breadcrumb a:hover { color: var(--accent); text-decoration: none; }
.breadcrumb-sep { opacity: .5; }
.breadcrumb-current { color: var(--text); font-weight: 600; min-width: 0; overflow-wrap: anywhere; }

.page-header { margin-bottom: 32px; }
.page-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; letter-spacing: -.01em; }
.page-sub { color: var(--muted); font-size: 14px; max-width: 62ch; }
.page-sub code {
  font-size: 13px; background: var(--panel-2); padding: 2px 6px; border-radius: 4px;
}

.panel {
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px; margin-bottom: 20px;
}
.panel--form { padding: 22px 22px 18px; }
.panel--elevated { box-shadow: var(--shadow-soft); border-color: rgba(124, 108, 240, .22); }
.panel--job { padding: 20px 22px; }

h2.section-label {
  font-size: 13px; font-weight: 700; color: var(--muted);
  letter-spacing: .06em; text-transform: uppercase;
  margin: 36px 0 14px;
}

button, .btn {
  background: var(--accent); color: #fff; border: 1px solid var(--accent);
  border-radius: 8px; padding: 11px 18px;
  font: 600 14px/1.2 var(--font);
  cursor: pointer; transition: background .15s, border-color .15s, color .15s, opacity .15s, box-shadow .15s;
}
button:hover:not(:disabled), .btn:hover:not(:disabled) { filter: brightness(1.06); }
button:disabled, .btn:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible {
  outline: none; box-shadow: var(--focus-ring); border-color: var(--accent);
}
.btn-primary {
  background: var(--accent); color: #fff; border-color: var(--accent);
  padding: 12px 22px; font-size: 15px; font-weight: 700;
  box-shadow: 0 4px 16px rgba(124, 108, 240, .28);
}
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn-secondary {
  background: var(--panel-2); color: var(--muted); border: 1px solid var(--border);
}
.btn-secondary:hover:not(:disabled) {
  color: var(--accent); border-color: var(--accent); filter: none;
}
.btn-tertiary, .btn-ghost {
  background: transparent; color: var(--muted); border: 1px solid transparent;
  padding: 9px 12px; font-weight: 600;
}
.btn-tertiary:hover:not(:disabled), .btn-ghost:hover:not(:disabled) {
  color: var(--accent); background: rgba(124, 108, 240, .08); filter: none;
}
.btn-text {
  background: none; border: none; color: var(--muted); padding: 8px 4px;
  font: 600 13px/1.2 var(--font); box-shadow: none;
}
.btn-text:hover:not(:disabled) { color: var(--accent); filter: none; text-decoration: underline; }

input, select {
  background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px 14px; font: inherit; font-size: 15px;
  transition: border-color .15s, box-shadow .15s;
}
input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: var(--focus-ring); }
input::placeholder { color: var(--muted); }

.form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.form-row input.riot-input { flex: 1; min-width: 240px; min-height: 48px; font-size: 16px; }
.form-actions {
  display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
  justify-content: space-between; margin-top: 16px;
}
.form-row-end { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.form-row-end select { min-height: 48px; }
.form-row-end .btn-primary { min-height: 48px; }
.player-row { margin-bottom: 10px; }
.player-row .remove-player { padding: 10px 12px; }
.hint { margin: 12px 0 0; color: var(--muted); font-size: 13px; }
.error { color: var(--loss); font-size: .9rem; min-height: 1.2em; margin-top: 8px; }
.muted { color: var(--muted); font-size: .9rem; }

.player-cards {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px; margin-bottom: 8px;
}
.player-card {
  display: block; padding: 16px 18px; background: var(--panel);
  border: 1px solid var(--border); border-radius: var(--radius); color: var(--text);
  text-decoration: none; font-weight: inherit;
  transition: border-color .15s, background .15s, transform .15s;
}
.player-card:hover {
  border-color: var(--accent); background: var(--panel-2); text-decoration: none;
  transform: translateY(-1px);
}
.player-card-name {
  display: flex; align-items: flex-start; gap: 8px;
}
.player-card-status {
  width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
  flex: none; margin-top: 8px; display: none;
}
.player-card.is-busy .player-card-status { display: inline-block; animation: pulse 1.4s ease-in-out infinite; }
.player-card-members {
  display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0;
}
.player-card-member {
  display: flex; align-items: center; gap: 8px;
  font-size: 14px; font-weight: 600; line-height: 1.3; min-width: 0;
}
.player-card-icon {
  width: 24px; height: 24px; border-radius: 4px; object-fit: cover;
  background: var(--panel-2); border: 1px solid var(--border); flex: none;
}
.player-card-label { min-width: 0; overflow-wrap: anywhere; }
.player-card-meta { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.45; }
.player-card-stage {
  display: none; margin-top: 8px; font-size: 12px; font-weight: 600; color: var(--accent);
}
.player-card.is-busy .player-card-stage { display: block; }
.badge-group {
  display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .04em;
  text-transform: uppercase; padding: 2px 6px; border-radius: 4px;
  background: rgba(124, 108, 240, 0.15); color: var(--accent); flex-shrink: 0;
  margin-top: 4px;
}

.reports-empty {
  padding: 28px 22px; border: 1px dashed var(--border); border-radius: var(--radius);
  background: rgba(23, 26, 36, .55); color: var(--muted); font-size: 14px; line-height: 1.5;
}
.reports-empty strong { display: block; color: var(--text); font-size: 15px; margin-bottom: 6px; }

.player-members {
  display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
  margin: 0 0 8px;
}
.player-member {
  display: flex; align-items: center; gap: 10px;
  font-size: 24px; font-weight: 700; line-height: 1.25; color: var(--text);
  letter-spacing: -.01em;
}
.player-member-label { min-width: 0; overflow-wrap: anywhere; }
.player-member-icon {
  width: 32px; height: 32px; border-radius: 8px; object-fit: cover;
  background: var(--panel-2); border: 1px solid var(--border); flex: none;
}

.build-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px;
}
.build-card {
  display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px;
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--text); text-decoration: none; font-size: 13px; font-weight: inherit;
  transition: border-color .15s, background .15s, transform .15s;
}
.build-card:hover {
  border-color: var(--accent); background: var(--panel-2); text-decoration: none;
  transform: translateY(-1px);
}
.build-card .game-icon {
  width: 48px; height: 48px; border-radius: 10px; flex-shrink: 0;
  background: var(--panel-2); border: 1px solid var(--border);
}
.build-card-body { flex: 1; min-width: 0; }
.build-card strong {
  display: block; font-size: 15px; font-weight: 700; line-height: 1.3;
}
.build-card-role {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 4px;
}
.build-card .meta { font-size: 13px; color: var(--muted); margin-top: 6px; }
.build-card .meta .win { color: var(--win); font-weight: 700; font-size: 14px; }
.build-card .meta .loss { color: var(--loss); font-weight: 700; font-size: 14px; }
.build-card-updated { font-size: 11px; color: var(--muted); margin-top: 6px; opacity: .85; }
.build-card-badge {
  display: inline-block; margin-top: 8px; font-size: 10px; font-weight: 700;
  letter-spacing: .04em; text-transform: uppercase; padding: 3px 7px; border-radius: 4px;
  background: rgba(124, 108, 240, 0.15); color: var(--accent);
}
.build-card--skeleton {
  pointer-events: none; min-height: 88px;
  background: linear-gradient(90deg, var(--panel) 0%, var(--panel-2) 50%, var(--panel) 100%);
  background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite;
  border-style: dashed;
}
.role-icon { flex-shrink: 0; object-fit: contain; opacity: .92; }
.role-icon--sm { width: 16px; height: 16px; }

.status-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; }
.dot.ok { background: var(--win); }
.dot.err { background: var(--loss); }
.dot.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
@keyframes shimmer {
  0% { background-position: 100% 0; }
  100% { background-position: -100% 0; }
}
.progress-track {
  height: 8px; border-radius: 4px; background: var(--panel-2);
  border: 1px solid var(--border); overflow: hidden; margin-top: 14px;
}
.progress-fill { height: 100%; width: 0%; background: var(--accent); transition: width .4s; }

.job-stages {
  list-style: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px; margin: 18px 0 4px;
}
.job-stage {
  position: relative; padding: 10px 8px 10px 10px;
  border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2);
  font-size: 11px; font-weight: 600; color: var(--muted); line-height: 1.3;
}
.job-stage::before {
  content: ""; display: block; width: 6px; height: 6px; border-radius: 50%;
  background: var(--border); margin-bottom: 6px;
}
.job-stage.is-done { color: var(--text); border-color: rgba(63, 182, 139, .35); }
.job-stage.is-done::before { background: var(--win); }
.job-stage.is-active {
  color: var(--text); border-color: rgba(124, 108, 240, .55);
  background: rgba(124, 108, 240, .1);
}
.job-stage.is-active::before { background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
.job-detail { margin-top: 10px; }
.actions-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }

@media (max-width: 720px) {
  .job-stages { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 640px) {
  .shell { padding: 36px 16px 56px; }
  .build-grid { grid-template-columns: 1fr; }
  .player-cards { grid-template-columns: 1fr; }
  .form-row-end { margin-left: 0; width: 100%; }
  .form-row-end .btn-primary, .form-row-end select { flex: 1; }
  .form-actions { flex-direction: column; align-items: stretch; }
}
</style>
</head>
<body>
<div class="shell">
  <a class="app-brand" href="/">
    {% if logo_href %}
    <img src="{{ logo_href }}" alt="" class="app-logo" aria-hidden="true">
    {% endif %}
    <span class="app-brand-title">{{ app_title }}</span>
  </a>
  {% block nav %}{% endblock %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
